services:
  churchtools-api:
    image: schowave/churchtools:latest
    container_name: churchtools-api
    ports:
      - "5005:5005"
    volumes:
      - ./data:/app/data
    environment:
      - CHURCHTOOLS_BASE=${CHURCHTOOLS_BASE:?Bitte CHURCHTOOLS_BASE setzen (z.B. meine-gemeinde.church.tools)}
      - DB_PATH=/app/data/churchtools.db
      # Optional: only these ChurchTools groups / persons may use the app (comma-separated ids)
      # - ALLOWED_GROUP_IDS=12
      # - ALLOWED_PERSON_IDS=7,42
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

[tools]
python = "3.14"
uv = "0.11"
trivy = "0.74.0"
"pipx:pip-audit" = "2.10.1"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install app and dev dependencies into .venv"
run = "uv pip install -e '.[dev]'"

[tasks.lock]
description = "Regenerate requirements.txt (pinned runtime deps for the Docker image)"
run = "uv pip compile pyproject.toml --python-version 3.14 --upgrade --generate-hashes -o requirements.txt"

[tasks.migrate]
description = "Run database migrations"
run = "alembic upgrade head"

[tasks.run]
description = "Run migrations and start dev server with auto-reload"
depends = ["migrate"]
run = "uvicorn app.main:app --reload --host 0.0.0.0 --port 5005"

[tasks.test]
description = "Run test suite"
run = "pytest tests/ -q"

[tasks.cov]
description = "Run test suite with coverage report"
run = "pytest --cov=app tests/ --cov-report=term --cov-report=xml"

[tasks.lint]
description = "Check code style (ruff)"
run = ["ruff check .", "ruff format --check ."]

[tasks.format]
description = "Auto-fix code style (ruff)"
run = ["ruff check --fix .", "ruff format ."]

[tasks.audit]
description = "Check pinned runtime dependencies for known vulnerabilities"
run = "pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off"

[tasks.scan]
description = "Scan the locally built image for fixable HIGH/CRITICAL vulnerabilities"
run = "trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress ${IMAGE:-churchtools-local}"

[tasks.smoke]
description = "Start the built image and check health, login page and static files"
run = "scripts/smoke_test.sh"

[tasks.preview]
description = "Render a sample PDF for layout testing"
run = "python scripts/preview_pdf.py"

[tasks.build]
description = "Build container image locally"
run = "podman build -t churchtools-local ."

[tasks.run-docker]
description = "Build and run the container image locally (data in ./data)"
depends = ["build"]
run = """
mkdir -p data
podman run --rm -p 5005:5005 -v ./data:/app/data --env-file .env \
  -e DB_PATH=/app/data/churchtools.db churchtools-local
"""

[tasks.login]
description = "Log in via browser against the running app and save the session to .auth/state.json"
run = [
  "uv run --no-project --with playwright playwright install chromium",
  "uv run --no-project --with playwright python scripts/capture_login.py",
]

[tasks.login-clear]
description = "Delete the saved browser session (.auth/)"
run = "rm -rf .auth"

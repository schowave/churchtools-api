[project]
name = "churchtools-api"
version = "7.6.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.163.2",
    "uvicorn==0.54.0",
    "alembic==1.20.1",
    "sqlalchemy==2.1.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "httpx2==2.16.2",
    "jinja2==3.1.6",
    "pdf2image==1.17.0",
    "python-dateutil==4.0.0",
    "babel==2.18.0",
    "reportlab==5.1.0",
    "structlog==26.1.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_token_validation: do not mock ChurchTools login token validation",
    "real_sessions: use the real session store instead of treating the cookie as the token",
]
filterwarnings = [
    "ignore:the load_module\\(\\) method is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default values by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

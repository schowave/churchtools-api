[project]
name = "churchtools-api"
version = "7.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "alembic==1.20.0",
    "sqlalchemy==2.1.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pdf2image==1.17.0",
    "python-dateutil==2.9.0.post0",
    "babel==2.18.0",
    "reportlab==5.0.1",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_token_validation: do not mock ChurchTools login token validation",
]
filterwarnings = [
    "ignore:the load_module\\(\\) method is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
